# Configuração para a Netlify tratar o projeto como um site Next.js
[build]
  command = "next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://carrinhodanalva.netlify.app/*"
  to = "https://carrinhodanalva.com/:splat"
  status = 301
  force = true